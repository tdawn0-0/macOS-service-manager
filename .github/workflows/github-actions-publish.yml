name: release

# Pushing a tag on master, as v0.2.0, releases that version: the app is tested,
# built, signed with the Developer ID, notarized, and published with its disk
# image. A tag with a suffix, as v0.2.0-rc.1, makes a prerelease. The version comes
# from the tag, so mygo.json does not need changing first.
#
#   git tag v0.2.0 && git push origin master v0.2.0
#
# scripts/setup-release-secrets.sh sets up the secrets this needs. The job
# cannot start until that environment allows the tag.
on:
  push:
    tags:
      - 'v[0-9]*'
      - 'msm-v[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    # Holds the secrets, and hands them only to the tags above.
    environment: release
    permissions:
      contents: write
    steps:
      # Pinned to a commit: this job can use the signing certificate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All the history, to tell whether the tag is on master.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#msm-}
          version=${version#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version, as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git rev-parse --verify --quiet origin/master >/dev/null; then
            echo "::error::origin/master is not in this checkout"
            exit 1
          fi
          # An annotated tag's object is not the commit. Peel it.
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/master; then
            echo "::error::$TAG is not on master. Push master too: git push origin master $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has been released already"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Before the certificate is on the machine.
      - name: test
        run: |
          set -euo pipefail
          go test ./...

      - name: set the version
        run: |
          set -euo pipefail
          jq --arg version "$VERSION" '.version = $version' mygo.json > mygo.json.new
          mv mygo.json.new mygo.json

      - name: install the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The secret $name is missing. See scripts/setup-release-secrets.sh"
              exit 1
            fi
          done
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          # The authority of a Developer ID certificate, should the machine lack it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/authority.cer"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # No -t: that imports the certificate and leaves the private key out,
          # so codesign later finds nothing it can sign with.
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/authority.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/authority.cer"
          # The same kind of profile FinderActions keeps in the login keychain.
          xcrun notarytool store-credentials msm \
            --keychain "$keychain" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --no-validate
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: build, sign and notarize
        env:
          NOTARY_PROFILE: msm
          REQUIRE_NOTARIZE: "1"
        run: |
          set -euo pipefail
          # A new step does not keep the keychain unlocked.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          NOTARY_KEYCHAIN="$KEYCHAIN_PATH" scripts/package.sh --skip-tests

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dmg=$(find build/darwin-universal -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg" ] || [ ! -f "$dmg" ]; then
            echo "::error::no disk image in build/darwin-universal"
            exit 1
          fi
          # Nothing goes out that macOS would warn about.
          xcrun stapler validate "$dmg"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          args=(gh release create "$TAG" "$dmg" --verify-tag
            --title "macOS Service Manager v$VERSION"
            --notes "SHA-256 of the disk image: \`$sha\`"
            --generate-notes)
          case "$VERSION" in
          *-*) args+=(--prerelease --latest=false) ;;
          esac
          "${args[@]}"

      - name: remove the signing certificate
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/authority.cer"
