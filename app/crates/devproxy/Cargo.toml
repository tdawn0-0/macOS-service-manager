[package]
name = "devproxy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Devbase Phase 3: local HTTPS reverse proxy, generational local CA, and Cloudflare tunnel"

# Standalone workspace: the app integration is a later phase, and this crate
# builds and tests without the GUI workspace.
[workspace]

[dependencies]
devcore = { path = "../devcore" }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "http2"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "io-util", "process", "signal"] }
tokio-rustls = "0.26"
url = "2"
webpki-roots = "1"
x509-parser = { version = "0.17", features = ["verify"] }
time = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
