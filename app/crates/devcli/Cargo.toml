[package]
name = "devcli"
version = "0.1.0"
edition = "2024"
publish = false
description = "The public Devbase CLI contract, ported from internal/devcli"

# Standalone workspace like devcore/devproxy: the app integration lands in
# Phase 4's dispatch slice, and this crate builds without the GUI workspace.
[workspace]

[dependencies]
devcore = { path = "../devcore" }
devproxy = { path = "../devproxy" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
plist = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
devcore = { path = "../devcore" }
