name: 'publish'

on:
  push:
    branches:
      - release

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      # MyGo needs no cgo, so one runner builds the app for both Mac architectures.
      - name: build
        run: go tool mygo build -platform "darwin/arm64,darwin/amd64"

      - name: upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version mygo.json)
          tag="msm-v${version}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "macOS Service Manager v${version}" \
              --notes "See the assets to download this version and install."
          fi
          gh release upload "$tag" build/*/*.dmg --clobber
