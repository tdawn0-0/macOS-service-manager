[package]
name = "nsh-app-devbase"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
exclude = ["crates/devcore", "crates/devproxy", "crates/devcli"]

[dependencies]
nsh-core = "0.6.1"
nsh-base = { version = "0.6.1", default-features = false }
nsh-engine = { version = "0.6.1", default-features = false }
nsh-updater = "0.6.1"
env_logger = "0.11"
log = "0.4"
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt"] }
devcore = { path = "crates/devcore" }
devproxy = { path = "crates/devproxy" }
devcli = { path = "crates/devcli" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-apple = "0.6.1"
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["svg"] }

[dev-dependencies]
nsh-testing = "0.6.1"

[profile.release]
lto = "thin"
strip = "symbols"
