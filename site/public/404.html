<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Devbase</title>
  <meta name="theme-color" content="#fcfcfb" id="meta-theme-color">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" href="/icon.png">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('devbase-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#09090b');
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20261122a">
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <img src="/icon.svg" alt="Devbase" width="60" height="60" class="not-found-icon">
      <h1 class="display section-title">Page not found.</h1>
      <p>Nothing at this route on <code>devbase.jyeu.xyz</code>.</p>
      <div class="hero-cta">
        <a href="/" class="btn-primary">
          <span>Back to Devbase</span>
          <span class="btn-dot" aria-hidden="true">→</span>
        </a>
        <a href="https://github.com/tdawn0-0/macOS-service-manager/releases/latest" class="btn-ghost">
          Releases
        </a>
      </div>
    </div>
  </main>
</body>
</html>
