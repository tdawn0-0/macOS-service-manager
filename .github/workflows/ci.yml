name: test

# The same tests as a release, on every push and pull request, without the
# signing certificate. A tag is a release, and that workflow tests again.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo --version
          rustc --version

      - name: install nsh
        run: |
          set -euo pipefail
          brew install longbridge/tap/nsh
          nsh --version

      - name: fetch dependencies
        run: |
          set -euo pipefail
          for dir in app app/crates/devcore app/crates/devproxy app/crates/devcli; do
            (cd "$dir" && cargo fetch --locked)
          done

      - name: test
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          (cd app && cargo test)
          for crate in devcore devproxy devcli; do
            (cd "app/crates/$crate" && cargo test && cargo clippy --all-targets -- -D warnings && cargo fmt --check)
          done
          (cd app && cargo clippy --all-targets -- -D warnings && cargo fmt --check && nsh build)
          (cd app && nsh package --target macos)
          test -s app/.nsh/out/Devbase.app/Contents/Resources/nsh/assets/nsh-updater.json
          python3 scripts/verify-macos-requirements.py app/.nsh/out/Devbase.app
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/collect-third-party-notices.py --check
